{{- if not .Values.azure.aksSecretsProviderAvailable -}}

kind: Secret
apiVersion: v1
metadata:
  name: {{ template "montandon-etl.secretname" . }}
  labels:
    app: {{ include "montandon-etl.fullname" . }}
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ required "secrets.DJANGO_SECRET_KEY" .Values.secrets.DJANGO_SECRET_KEY | quote }}

  # Sentry
  SENTRY_DSN: {{ .Values.secrets.SENTRY_DSN | quote }}

  # ETL Sources
  EMDAT_AUTHORIZATION_KEY: {{ required "secrets.EMDAT_AUTHORIZATION_KEY" .Values.secrets.EMDAT_AUTHORIZATION_KEY | quote }}
  IDMC_CLIENT_ID: {{ required "secrets.IDMC_CLIENT_ID" .Values.secrets.IDMC_CLIENT_ID | quote }}
  GFD_CREDENTIAL: {{ required "secrets.GFD_CREDENTIAL" .Values.secrets.GFD_CREDENTIAL | quote }}
  GFD_SERVICE_ACCOUNT: {{ required "secrets.GFD_SERVICE_ACCOUNT" .Values.secrets.GFD_SERVICE_ACCOUNT | quote }}
  IFRC_DATA_URL: {{ required "secrets.IFRC_DATA_URL" .Values.secrets.IFRC_DATA_URL | quote }}
  PDC_AUTHORIZATION_KEY: {{ required "secrets.PDC_AUTHORIZATION_KEY" .Values.secrets.PDC_AUTHORIZATION_KEY | quote }}
  PDC_BASE_URL: {{ required "secrets.PDC_BASE_URL" .Values.secrets.PDC_BASE_URL | quote }}
  ARC_USERNAME: {{ required "secrets.ARC_USERNAME" .Values.secrets.ARC_USERNAME | quote }}
  ARC_PASSWORD: {{ required "secrets.ARC_PASSWORD" .Values.secrets.ARC_PASSWORD | quote }}

  # Database
  {{- if .Values.postgresql.enabled }}
  DB_NAME: {{ .Values.postgresql.auth.database | quote }}
  DB_USER: "postgres"
  DB_PASSWORD: {{ .Values.postgresql.auth.postgresPassword | quote }}
  DB_HOST: {{ include "postgresql.v1.primary.fullname" .Subcharts.postgresql }}
  DB_PORT: {{ include "postgresql.v1.service.port" .Subcharts.postgresql | quote }}
  {{- else }}
  DB_NAME: {{ required "secrets.DB_NAME" .Values.secrets.DB_NAME | quote }}
  DB_USER: {{ required "secrets.DB_USER" .Values.secrets.DB_USER | quote }}
  DB_PASSWORD: {{ required "secrets.DB_PASSWORD" .Values.secrets.DB_PASSWORD | quote }}
  DB_HOST: {{ required "secrets.DB_HOST" .Values.secrets.DB_HOST | quote }}
  DB_PORT: {{ required "secrets.DB_PORT" .Values.secrets.DB_PORT | quote }}
  {{- end }}

  # Redis
  {{- if .Values.redis.enabled }}
  CELERY_REDIS_URL: "redis://{{ printf "%s-master" (include "common.names.fullname" .Subcharts.redis) }}:6379/0"
  {{- else }}
  CELERY_REDIS_URL: {{ required "env.CELERY_REDIS_URL" .Values.env.CELERY_REDIS_URL | quote }}
  {{- end }}

  # Minio
  {{- if .Values.minio.enabled }}
  AWS_S3_ENDPOINT_URL: "https://{{ .Values.minio.apiIngress.hostname }}/"
  AWS_S3_ACCESS_KEY_ID: {{ required ".Values.minio.auth.rootUser" .Values.minio.auth.rootUser }}
  AWS_S3_SECRET_ACCESS_KEY: {{ required ".Values.minio.auth.rootPassword" .Values.minio.auth.rootPassword }}
  AWS_S3_REGION: "us-east-1"
  {{- end }}

  # Geocoding
  {{- if .Values.geocoding.enabled }}
  GEOCODER_URL: {{ printf "http://%s:80/" (include "goecoding-helm.servicename" .Subcharts.geocoding) | quote }}
  {{- else }}
  GEOCODER_URL: {{ required "secrets.GEOCODER_URL" .Values.secrets.GEOCODER_URL | quote }}
  {{- end}}

  # Additional secrets
  {{- range $name, $value := .Values.secretsAdditional }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}

{{- end }}
