# Alpha environment overlay.
# Database, cache (Dragonfly), broker (RabbitMQ) and object storage are supplied
# externally at deploy time (operator-managed infra + external secrets); this
# overlay carries only the alpha-specific workload sizing. Per-instance hosts,
# object-storage buckets and secrets are supplied per-environment at deploy time.
app:
  environment: ALPHA

  api:
    resources:
      requests:
        memory: 3Gi
      limits:
        memory: 4Gi

  worker:
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        replicaCount: 5
        resources:
          limits:
            memory: 1.5Gi
      extraction:
        resources:
          requests:
            memory: 1.5Gi
      transform:
        resources:
          requests:
            memory: 1.5Gi
