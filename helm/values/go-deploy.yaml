# Azure (IFRC GO) deployment overlay: workload-identity service account +
# secret-store CSI wiring. Real client/tenant/keyvault ids and container names
# are deployment-specific and supplied per-environment at deploy time.
geocoding:
  server:
    persistence:
      # TODO: If not provided don't include storageClassName in the manifest
      storageClassName: default

app:
  fullnameOverride: monty-etl

  podLabels:
    azure.workload.identity/use: 'true'

  api:
    ingress:
      enabled: true
      # className left unset — routed to the cluster's default IngressClass.
      tls:
        enabled: true

  env:
    DJANGO_DEBUG: "false"
    DJANGO_TIME_ZONE: UTC
    DJANGO_ALLOWED_HOSTS: "*"
    # Azure storage account/containers are supplied per-environment.
    # ETL eoapi endpoints are supplied per-environment.

  serviceAccountName: "service-token-reader"
  serviceAccount:
    create: true
    automountServiceAccountToken: true
    # annotations:
    #   azure.workload.identity/client-id:  # supplied per-environment
    labels:
      azure.workload.identity/use: "true"

  secretsStoreCsiDriver:
    create: true
    provider: azure
    parameters:
      usePodIdentity: "false"
      # clientID:      # supplied per-environment
      # keyvaultName:  # supplied per-environment
      # tenantId:      # supplied per-environment
    secretsKeyMap:
      # DB
      DB_HOST: DB-HOST
      DB_NAME: DB-NAME
      DB_PASSWORD: DB-PASSWORD
      DB_PORT: DB-PORT
      DB_USER: DB-USER
      # Misc
      DJANGO_SECRET_KEY: DJANGO-SECRET-KEY
      SENTRY_DSN: SENTRY-DSN
      # ETL sources config
      EMDAT_AUTHORIZATION_KEY: EMDAT-AUTHORIZATION-KEY
      GFD_CREDENTIAL: GFD-CREDENTIAL
      GFD_SERVICE_ACCOUNT: GFD-SERVICE-ACCOUNT
      IDMC_CLIENT_ID: IDMC-CLIENT-ID
      PDC_ARCGIS_USERNAME: PDC-ARCGIS-USERNAME
      PDC_ARCGIS_PASSWORD: PDC-ARCGIS-PASSWORD
      PDC_SENTRY_AUTHORIZATION_KEY: PDC-SENTRY-AUTHORIZATION-KEY
