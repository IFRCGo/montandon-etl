geocoding:
  server:
    persistence:
      storageClassName: "longhorn"

app:
  environment: ALPHA-1
  fullnameOverride: monty-etl-1

  ingress:
    host: monty-etl-1.ifrc-go.dev.monty.com
    enabled: true
    className: nginx

  postgresql:
    enabled: false
    auth:
      postgresPassword: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      database: monty-etl
    primary:
      nodeSelector:
        node.kubernetes.io/disk-raid: "true"
      persistence:
        storageClass: "local-path"
        size: 2Gi  # NOTE: This doesn't do anything for local-path
      # TODO: Move this to the values/alpha.yaml
      resources:
        requests:
          cpu: "0.2"
          memory: 1Gi
        limits:
          cpu: "4"

  minio:
    enabled: true
    persistence:
      enabled: true
      size: 2Gi
    nodeSelector:
      node.kubernetes.io/disk-raid: "true"
    global:
      defaultStorageClass: "local-path"
    apiIngress:
      ingressClassName: nginx
      hostname: monty-etl-1-minio.ifrc-go.dev.monty.com
    auth:
      rootUser: monty-etl
      rootPassword: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX

  redis:
    master:
      nodeSelector:
        node.kubernetes.io/disk-raid: "true"
      persistence:
        storageClass: "local-path"
        size: 1Gi  # NOTE: This doesn't do anything for local-path

  rabbitmq:
    auth:
      password: XXXXX
      erlangCookie: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    nodeSelector:
      node.kubernetes.io/disk-raid: "true"
    persistence:
      enabled: true
      storageClass: "local-path"

  worker:
    enabled: true
    queues:
      usgs-extraction-01:
        enabled: false
        replicaCount: 1
        celeryArgs: ["--concurrency", "2", "--max-tasks-per-child", "10", "-Q", "usgs-extraction-01"]
        env:
          REQUESTS_PROXY_TO_USE: EXTRACTION_PROXY_1
      usgs-extraction-02:
        enabled: false
        replicaCount: 1
        celeryArgs: ["--concurrency", "2", "--max-tasks-per-child", "10", "-Q", "usgs-extraction-02"]
        env:
          REQUESTS_PROXY_TO_USE: EXTRACTION_PROXY_2
      usgs-extraction-03:
        enabled: false
        replicaCount: 1
        celeryArgs: ["--concurrency", "2", "--max-tasks-per-child", "10", "-Q", "usgs-extraction-03"]
        env:
          REQUESTS_PROXY_TO_USE: EXTRACTION_PROXY_3
      usgs-extraction-04:
        enabled: false
        replicaCount: 1
        celeryArgs: ["--concurrency", "2", "--max-tasks-per-child", "10", "-Q", "usgs-extraction-04"]
        env:
          REQUESTS_PROXY_TO_USE: EXTRACTION_PROXY_4

  env:
    EOAPI_SYNC_LIMIT: "5000"
    # App Domain
    DJANGO_ALLOWED_HOSTS: "*"
    EOAPI_STAC_API_INTERNAL: https://montandon-eoapi-stage.monty.org/stac
    EOAPI_STAC_API_PUBLIC: https://montandon-eoapi-stage.monty.org/stac

  secrets:
    DJANGO_SECRET_KEY: "XYZ"
    # Sentry
    SENTRY_DSN: https://XYZ@sentry.local.monty.com/36
    # Source
    EMDAT_AUTHORIZATION_KEY: XYZ
    GFD_CREDENTIAL: XYZ
    GFD_SERVICE_ACCOUNT: XYZ
    IDMC_CLIENT_ID: IDMCWSHSOLO009
    PDC_ARCGIS_PASSWORD: XXXXXXXXXXXX
    PDC_ARCGIS_USERNAME: monty-xyz
    PDC_SENTRY_AUTHORIZATION_KEY: XYZ
    # Database
    DB_HOST: "192.168.XX.YY"
    DB_USER: "k8s_monty"
    DB_PASSWORD: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX3"
    DB_NAME: "monty-etl"
    DB_PORT: "8432"
    # Proxy configs
    EXTRACTION_PROXY_1: socks5h://192.168.XX.YY:1081
    EXTRACTION_PROXY_2: socks5h://192.168.XX.YY:1082
    EXTRACTION_PROXY_3: socks5h://192.168.XX.YY:1083
    EXTRACTION_PROXY_4: socks5h://192.168.XX.YY:1084

  argoHook:
    hooks:
      # NOTE: Static Alpha users are only created for the alpha instances
      alpha-instance-users:
        enabled: true
        hook: PostSync
        command:
          - ./manage.py
          - shell
          - -c
          - |
            from django.contrib.auth import get_user_model;
            from django.db import transaction;

            User = get_user_model();

            user_data = [
                # Add user information in this format here
                # ("first_name last_name", "email", "password_hash", "is_superuser", "is_staff")
                ("Toggle Admin", "admin@monty.com", "good-hash", True, True),
            ];

            @transaction.atomic
            def create_initial_users(user_data):
                for name, email, password_hash, is_superuser, is_staff in user_data:
                    first_name, last_name = name.split(" ")
                    user, _ = User.objects.update_or_create(
                        email=email,
                        defaults={
                          "first_name": first_name,
                          "last_name": last_name,
                          "is_superuser": is_superuser,
                          "is_staff": is_superuser,
                          "password": password_hash,
                        },
                    )
                    print(f"Successfully created/update user {email=}");
            create_initial_users(user_data);
