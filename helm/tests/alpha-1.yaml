geocoding:
  server:
    persistence:
      storageClassName: "longhorn"

app:
  environment: ALPHA-1
  fullnameOverride: monty-etl-1

  extraEnvVars:
    # -- Geocoder
    - name: GEOCODER_URL
      value: http://monty-geocoder:80

  ingress:
    className: nginx
    host: monty-etl-1.ifrc-go.dev.alpha.com

  minio:
    auth:
      rootPassword: ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ
    nodeSelector:
      node.kubernetes.io/disk-raid: "true"
    global:
      defaultStorageClass: "local-path"
    apiIngress:
      ingressClassName: nginx
      hostname: monty-etl-1-minio.ifrc-go.dev.alpha.com

  redis:
    enabled: true
    master:
      nodeSelector:
        node.kubernetes.io/disk-raid: "true"
      persistence:
        storageClass: "local-path"
        size: 1Gi  # NOTE: This doesn't do anything for local-path

  rabbitmq:
    enabled: true
    auth:
      username: monty
      password: YYYYY
      erlangCookie: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    nodeSelector:
      node.kubernetes.io/disk-raid: "true"
    persistence:
      enabled: true
      storageClass: "local-path"

  localCacheVolume:
    storageClass: longhorn

  worker:
    enabled: true
    queues:
      # NOTE: Make sure keys are lowercase
      usgs-extraction-01:
        enabled: false
        replicaCount: 1
        celeryArgs: ["--concurrency", "2", "--max-tasks-per-child", "10", "-Q", "usgs-extraction-01"]
        env:
          REQUESTS_PROXY_TO_USE: EXTRACTION_PROXY_1
      usgs-extraction-02:
        enabled: false
        replicaCount: 1
        celeryArgs: ["--concurrency", "2", "--max-tasks-per-child", "10", "-Q", "usgs-extraction-02"]
        env:
          REQUESTS_PROXY_TO_USE: EXTRACTION_PROXY_2
      usgs-extraction-03:
        enabled: false
        replicaCount: 1
        celeryArgs: ["--concurrency", "2", "--max-tasks-per-child", "10", "-Q", "usgs-extraction-03"]
        env:
          REQUESTS_PROXY_TO_USE: EXTRACTION_PROXY_3
      usgs-extraction-04:
        enabled: false
        replicaCount: 1
        celeryArgs: ["--concurrency", "2", "--max-tasks-per-child", "10", "-Q", "usgs-extraction-04"]
        env:
          REQUESTS_PROXY_TO_USE: EXTRACTION_PROXY_4

  envConfigMapName: "monty-etl-1-api-configmap"
  env:
    # App Domain
    DJANGO_ALLOWED_HOSTS: "*"
    # Sentry
    EOAPI_DOMAIN: https://montandon-eoapi-stage.ifrc.org
    EOAPI_SYNC_LIMIT: "5000"  # TODO: Remove me after the stac issue is fixed


  secrets:
    DJANGO_SECRET_KEY: "XXXYYYZZZ"
    # Sentry
    SENTRY_DSN: https://xzy@sentry.local.alpha.com/36
    # Source
    EMDAT_AUTHORIZATION_KEY: XXLLLL
    GFD_CREDENTIAL: YYIIII
    GFD_SERVICE_ACCOUNT: zyz@123.iam.gserviceaccount.com
    IDMC_CLIENT_ID: IDMCUUUUUUUUUU
    PDC_ARCGIS_PASSWORD: HHHHHHHHHHHH
    PDC_ARCGIS_USERNAME: ifrc
    PDC_SENTRY_AUTHORIZATION_KEY: HHYYY
    # Database
    DB_HOST: "192.168.XX.YY"
    DB_USER: "k8s_monty"
    DB_PASSWORD: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    DB_NAME: "monty-etl"
    DB_PORT: "8432"
    # Proxy
    EXTRACTION_PROXY_1: socks5h://192.168.XY.ZZ:1081
    EXTRACTION_PROXY_2: socks5h://192.168.XY.ZZ:1082
    EXTRACTION_PROXY_3: socks5h://192.168.XY.ZZ:1083
    EXTRACTION_PROXY_4: socks5h://192.168.XY.:1084

  extraManifests:
    local-cache-pvc: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: monty-local-cache
        labels:
          app: {{ include "django-app.fullname" . }}
          environment: {{ .Values.environment }}
          release: {{ .Release.Name }}
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: 2Gi

  argoHook:
    hooks:
      # NOTE: Make sure keys are lowercase
      alpha-instance-users:
        enabled: true
        hook: PostSync
        # https://notes.tools.alpha.com/atIeJf9CRTCq8merGZ3A5Q#Steps-to-create-and-update-initial-creadential
        command:
          - ./manage.py
          - shell
          - -c
          - |
            from django.contrib.auth import get_user_model;
            from django.db import transaction;

            User = get_user_model();

            user_data = [
                # Add user information in this format here
                # ("first_name last_name", "email", "password_hash", "is_superuser", "is_staff")
                ("Toggle Admin", "admin@alpha.com", "hash-values", True, True),
            ];

            @transaction.atomic
            def create_initial_users(user_data):
                for name, email, password_hash, is_superuser, is_staff in user_data:
                    first_name, last_name = name.split(" ")
                    user, _ = User.objects.update_or_create(
                        email=email,
                        defaults={
                          "first_name": first_name,
                          "last_name": last_name,
                          "is_superuser": is_superuser,
                          "is_staff": is_superuser,
                          "password": password_hash,
                        },
                    )
                    print(f"Successfully created/update user {email=}");
            create_initial_users(user_data);
