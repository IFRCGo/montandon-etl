# Dummy values injected by cluster operators / CICD at deploy time.
# Only present so that the environment values files can be rendered standalone
# for snapshot testing (see ../tests.yaml). Not real deployment values.
app:
  image:
    name: local.example.com/ifrcgo/montandon-etl
    tag: develop.xxxxxxxx

  api:
    ingress:
      host: montandon-etl.example.com
      tls:
        secretName: montandon-etl-tls

  env:
    # Object storage (Azure, default backend)
    AZURE_STORAGE_ACCOUNT_NAME: dummyaccount
    AZURE_STORAGE_MEDIA_CONTAINER: dummy-media
    AZURE_STORAGE_STATIC_CONTAINER: dummy-static
    # ETL eoapi endpoints
    EOAPI_STAC_API_INTERNAL: https://eoapi.example.com/stac
    EOAPI_STAC_API_PUBLIC: https://eoapi.example.com/stac

  secrets:
    DJANGO_SECRET_KEY: dummy-secret-key
    # Database
    DB_NAME: dummy
    DB_USER: dummy
    DB_PASSWORD: dummy
    DB_HOST: dummy
    DB_PORT: "5432"
    # Sentry
    SENTRY_DSN: https://dummy@sentry.example.com/1
    # ETL sources
    EMDAT_AUTHORIZATION_KEY: dummy-key
    GFD_CREDENTIAL: dummy-gfd-cred
    GFD_SERVICE_ACCOUNT: dummy-gfd-service-account
    IDMC_CLIENT_ID: dummy-client-id
    PDC_ARCGIS_USERNAME: dummy-username
    PDC_ARCGIS_PASSWORD: dummy-password
    PDC_SENTRY_AUTHORIZATION_KEY: dummy-key

  # Secret-store CSI dummies so the go-deploy (Azure) overlay renders standalone.
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
  secretsStoreCsiDriver:
    parameters:
      clientID: "00000000-0000-0000-0000-000000000000"
      keyvaultName: "dummy-kv"
      tenantId: "00000000-0000-0000-0000-000000000000"
