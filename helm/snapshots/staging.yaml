# Source: montandon-etl-helm/charts/geocoding/templates/geocoding/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geocoder-geocoding
  labels:
    app: geocoder
    component: geocoding
    release: release-name
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geocoder
      component: geocoding
  template:
    metadata:
      labels:
        app: geocoder
        component: geocoding
    spec:
      containers:  # TODO: Add Container Init
        - name: geocoding
          image: "ghcr.io/ifrcgo/geocoding-service:main.8c43f51"
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "service:app", "--host=0.0.0.0", "--port=8002", "--workers=1"]
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          # TODO: livenessProbe and readinessProbe
          resources:
            limits:
              cpu: "4"
              memory: 3Gi
            requests:
              cpu: "0.1"
              memory: 1.5Gi
          env:
            - name: SERVICE_PORT
              value: "8002"
            - name: WAB_FILE_PATH
              value: "/shared-volume/simple.wab.fgb"
            - name: GAUL_FILE_PATH
              value: "/shared-volume/simple.gaul.gpkg"
          volumeMounts:
            - mountPath: "/shared-volume"
              name: shared-volume
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: geocoder-shared-volume

