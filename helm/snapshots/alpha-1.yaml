apiVersion: batch/v1
kind: Job
metadata:
  name: monty-etl-1-alpha-instance-users
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  template:
    metadata:
      annotations:
        checksum/secret: e1e4cc9db26e064a775e760c289197356e51c994a9e588bd236fd5b68ae41332
        checksum/configmap: 60ef052e64fd9c6b13db30affba7a3a988df7f4c66f554e28b78fed0a1beff24
      labels:
        app: monty-etl-1
        component: argo-hooks
    spec:
      restartPolicy: "Never"
      volumes:
        - name: local-cache-volume
          persistentVolumeClaim:
            claimName: monty-local-cache
      containers:
        - name: alpha-instance-users
          image: "SET-BY-CICD-IMAGE:SET-BY-CICD-TAG"
          imagePullPolicy: IfNotPresent
          command: 
            - ./manage.py
            - shell
            - -c
            - |
              from django.contrib.auth import get_user_model;
              from django.db import transaction;
            
              User = get_user_model();
            
              user_data = [
                  # Add user information in this format here
                  # ("first_name last_name", "email", "password_hash", "is_superuser", "is_staff")
                  ("Toggle Admin", "admin@monty.com", "good-hash", True, True),
              ];
            
              @transaction.atomic
              def create_initial_users(user_data):
                  for name, email, password_hash, is_superuser, is_staff in user_data:
                      first_name, last_name = name.split(" ")
                      user, _ = User.objects.update_or_create(
                          email=email,
                          defaults={
                            "first_name": first_name,
                            "last_name": last_name,
                            "is_superuser": is_superuser,
                            "is_staff": is_superuser,
                            "password": password_hash,
                          },
                      )
                      print(f"Successfully created/update user {email=}");
              create_initial_users(user_data);
          resources:
            limits:
              cpu: "4"
              memory: 2Gi
            requests:
              cpu: "0.1"
              memory: 1Gi
          envFrom:
            - secretRef:
                name: monty-etl-1-secret
            - configMapRef:
                name: monty-etl-1-env-name
          env:
            - name: DJANGO_APP_TYPE
              value: "hook"
            - name: GEOCODER_URL
              value: http://monty-geocoder:80
          volumeMounts:
            - mountPath: /local-cache-data
              name: local-cache-volume
