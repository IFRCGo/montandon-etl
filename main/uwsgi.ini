[uwsgi]

chdir = /code/
module = main.wsgi

master = true
processes = 10
http = 0.0.0.0:80
chmod = 666

vacuum = true
harakiri = 60

# Skip access logging for liveness/readiness probes — they fire every few seconds.
# Caveat: uWSGI's `donotlog` is unconditional, so this also suppresses error responses (5xx) on these routes.
# NOTE: trailing `/?` matches the probe URLs (/healthz/live/, /healthz/ready/), which carry a trailing slash.
route = ^/healthz/(live|ready)/?$ donotlog:
