
x-server: &base_server_setup
  restart: unless-stopped
  image: etl-montandon/server
  build:
    context: ./
  # Used for python debugging.
  stdin_open: true
  tty: true
  env_file:
    - .env
  environment: &base_server_environments
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?err}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://monty:monty@rabbitmq:5672/celery}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      # Health-checks
      HEALTHCHECK_REDIS_URL: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      HEALTHCHECK_RABBITMQ_URL: ${CELERY_BROKER_URL:-amqp://monty:monty@rabbitmq:5672/celery}
      # ETL Sources
      EMDAT_AUTHORIZATION_KEY: ${EMDAT_AUTHORIZATION_KEY?error}
      IDMC_CLIENT_ID: ${IDMC_CLIENT_ID?error}
      GFD_CREDENTIAL: ${GFD_CREDENTIAL?error}
      GFD_SERVICE_ACCOUNT: ${GFD_SERVICE_ACCOUNT?error}
      IFRC_DATA_URL: ${IFRC_DATA_URL?error}
      DESINVENTAR_DATA_URL: ${DESINVENTAR_DATA_URL?error}
      GEOCODER_URL: ${GEOCODER_URL?error}
      PDC_AUTHORIZATION_KEY: ${PDC_AUTHORIZATION_KEY?error}
      PDC_BASE_URL: ${PDC_BASE_URL?error}
      USGS_DATA_URL: ${USGS_DATA_URL?error}
      GLIDE_URL: ${GLIDE_URL?error}
      GDACS_URL: ${GDACS_URL?error}
      EMDAT_URL: ${EMDAT_URL?error}

      ARC_DOMAIN: ${ARC_DOMAIN?error}
      ARC_USERNAME: ${ARC_USERNAME?error}
      ARC_PASSWORD: ${ARC_PASSWORD?error}
      IBTRACS_DATA_URL: ${IBTRACS_DATA_URL?error}
      # ETL Load
      EOAPI_DOMAIN: ${EOAPI_DOMAIN?error}
      DJANGO_APP_ENVIRONMENT: ${DJANGO_APP_ENVIRONMENT:-development}
  volumes:
    - .:/code
    - ipython_data_local:/root/.ipython/profile_default   # persist ipython data, including ipython history
    - local_cache_pull:/local-cache-data
  depends_on:
    - db
    - redis
    - rabbitmq

services:
  db:
    image: postgis/postgis:15-3.5-alpine
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    volumes:
      - redis-data:/data
    # post_start:  # FIXME: Uncomment after github action have docker compose version > 1.30
    #   # NOTE: Set maxmemory for database /0 (celery results backend)
    #   - command: sh -c "redis-cli SELECT 0 && redis-cli CONFIG SET maxmemory 500mb"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_VHOST: celery
      RABBITMQ_DEFAULT_USER: monty
      RABBITMQ_DEFAULT_PASS: monty
    ports:
      - 127.0.0.1:15672:15672  # Managements console
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  web:
    <<: *base_server_setup
    command: bash -c "/code/scripts/run_develop.sh"
    environment:
      <<: *base_server_environments
      DJANGO_APP_TYPE: "web"
    ports:
      - 8000:8000
    depends_on:
      - db
      - redis

  celery-beat:
    <<: *base_server_setup
    environment:
      <<: *base_server_environments
      DJANGO_APP_TYPE: "worker"
    command: bash -c "/code/scripts/run_worker_beat.sh"

  worker:
    <<: *base_server_setup
    environment:
      <<: *base_server_environments
      DJANGO_APP_TYPE: "worker"
    # FIXME: Use dev model celery
    command: bash -c "/code/scripts/run_worker.sh"

volumes:
  postgres-data:
  redis-data:
  rabbitmq_data:
  ipython_data_local:
  local_cache_pull:
