name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - project/*
      - chore/*
    tags:
      - "**"

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  _:
    uses: toggle-corp/banjo-action/.github/workflows/pipeline.yml@v0.5.0
    permissions:
      contents: read
      packages: write
      pull-requests: read
    with:
      # libs/pystac-monty declares a submodule of its own; the default one-level
      # checkout leaves it out of the build context.
      checkout__submodules: "recursive"
      # -- Same as CI (./ci.yml)
      # Job: Pre-commit
      pre_commit__apt_packages: "gdal-bin libgdal-dev"
      # Job: Docker
      docker__wait_cmd: "./manage.py wait_for_resources --db --cache --celery-broker"
      docker__migration_dummy_test: "main.tests.fake_test"
      docker__run_graphql_check: true
      docker__compose_file: "docker-compose.yml:./.github/docker-compose.yml"
      docker__compose_service_name: "web"
      docker__compose_test_cmd: "/code/scripts/run_tests.sh"
      # Job: Helm
      helm__chart_directory: "./helm"
      # Pinned: helm renders whitespace differently across releases and the
      # pipeline diffs the committed chart snapshots byte-for-byte.
      helm__version: "v4.2.2"
      # -- Publish
      docker__push: true
      helm__push: true
