services:
  web:
    image: $DOCKER_IMAGE_BACKEND
    build: !reset null
    env_file: !reset null
    environment:
      CI: "true"
    volumes:
      - ./coverage/:/code/coverage/
      - ./ci-share/:/ci-share/
    # geocoding-service must be waited for by condition: the test entrypoint only
    # waits for db/cache/broker, and `compose run` starts dependencies without
    # waiting for them to become healthy.
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      geocoding-service:
        condition: service_healthy

  geocoding-service:
    image: ghcr.io/ifrcgo/geocoding-service:main.8c43f51
    command: /bin/sh -c "uvicorn service:app --host 0.0.0.0 --port 8001 --reload --workers 1"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(3); s.connect((\"localhost\", 8001)); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Disable non-test services during CI.
  worker-beat: !reset null
  worker: !reset null
  worker-monitor: !reset null
