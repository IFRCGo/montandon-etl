[project]
name = "montandon-etl"
version = "0.1.0"
description = ""
authors = [{ name = "Togglecorp Dev", email = "dev@togglecorp.com" }]
requires-python = "~=3.12.3"
readme = "README.md"
dependencies = [
    "django>=5.1.3,<6",
    "django-environ",
    "psycopg2-binary>=2.9.9,<3",
    "celery[redis]>=5.4.0,<6",
    "flower", # celery dashboard
    "django-redis>=5.4.0,<6",
    "django-celery-beat>=2.7.0,<3",
    "django-storages[s3,azure]>=1.14,<1.15",
    "djangoql", # Admin panel query search
    "azure-identity", # Required by django-storages
    "pandas>=2.2.3,<3",
    "lxml>=5.3.0,<6",
    "pydantic>=2.10.2,<3",
    "pystac-monty",
    "requests[socks]>=2.32.3",
    "geopandas",
    "fiona>=1.10.1",
    "sentry-sdk",
    "ipython",
    "uwsgi",
    "earthengine-api>=1.5.1",
    # Dev
    "django-stubs",
    "celery-types",
    "django-health-check[rabbitmq,redis]>=4.0.0",
    "colorlog",
    "requests_cache",
    "termcolor",
    "ijson>=3.4.0",
    "pysocks>=1.7.1",
    "djangorestframework",
    "strawberry-graphql==0.278.1",
    "strawberry-graphql-django==0.58.0",
    "django-debug-toolbar",
    "django-cors-headers>=4.7.0",
    "json5",
]

[dependency-groups]
dev = [
    "pytest",
    "requests-mock",
    "pytest-django",
    "pytest-icdiff",
    "pytest-ordering",
    "pytest-profiling",
    "pytest-cov",
]

[tool.uv.sources]
pystac-monty = { path = "libs/pystac-monty", editable = true }

[tool.pyright]
exclude = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "**/migrations/*.py",
]
extraPaths = ["libs/pystac-monty"]
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 125
extend-exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "**/migrations/*",
    "__pycache__",
]

[tool.ruff.lint]
ignore = ["C901", "E701", "E203"]
extend-select = ["I", "E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"/**/tests/*_mock_data.py" = ["E501"]
"**/snap_test_*.py" = ["E501"]
