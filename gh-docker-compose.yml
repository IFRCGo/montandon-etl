services:
  web:
    image: $DOCKER_IMAGE_BACKEND
    build: !reset null
    env_file: !reset null
    environment:
      CI: "true"
    volumes:
      - ./coverage/:/code/coverage/
      - ./ci-share/:/ci-share/
    depends_on:
      - db
      - redis
      - rabbitmq
      - geocoding-service

  geocoding-service:
    image: ghcr.io/ifrcgo/geocoding-service:main.c26a216
    command: /bin/sh -c "uvicorn service:app --host 0.0.0.0 --port 8001 --reload --workers 1"

  # Disable non-test services during CI.
  worker-beat: !reset null
  worker: !reset null
  worker-monitor: !reset null
